id = "qtvbwfn.mybatis-duo"
name = "MyBatis Duo"
version = "0.3.3"
description = "MyBatis mapper navigation both ways (gutter arrows, Go to Definition, statement/parameter completion), statement generation, the @Param quickfix and SQL-log conversion."
authors = ["qtvbwfn"]
license = "Apache-2.0"
change-notes = "0.3.3 — mapper navigation both ways (gutter arrows, Go to Definition), statement and parameter completion, statement generation, the @Param quickfix and SQL-log conversion."
categories = ["frameworks"]
engines.openidea = "^1.5"
wasm = "dist/plugin.wasm"
activation = ["on-command:*"]

[capabilities]
required = ["project.read", "project.write", "editor.read", "clipboard"]

[[contributes.commands]]
id = "generate-statement"
title = "MyBatis Duo: Create Mapper Statement"

[[contributes.commands]]
id = "create-mapper-xml"
title = "MyBatis Duo: Create Mapper XML"

[[contributes.commands]]
id = "convert-sql-log"
title = "MyBatis Duo: Convert SQL Log to SQL"

[[contributes.providers]]
kinds = ["code-actions"]
languages = ["java"]

[[contributes.providers]]
kinds = ["completion"]
languages = ["java", "xml"]

[[contributes.documentIndexers]]
extensions = ["java", "xml"]

[[contributes.menus]]
menu = "editor.context"
command = "generate-statement"

[[contributes.menus]]
menu = "editor.context"
command = "create-mapper-xml"

[[contributes.menus]]
menu = "editor.context"
command = "convert-sql-log"
